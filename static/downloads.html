<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>下载客户端 · YwMatrix</title>
    <link rel="stylesheet" href="/static/shared.css">
    <style>
        body { overflow:auto; height:auto; min-height:100vh; }
        .downloads { max-width:1040px; margin:0 auto; padding:28px 24px 56px; }
        header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:52px; }
        a { color:var(--accent); }
        h1 { font-size:32px; letter-spacing:-.6px; }
        .intro { color:var(--text-secondary); margin:12px 0 26px; max-width:620px; }
        .platform-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:24px 0 8px; }
        .platform-tabs button { padding:9px 15px; border:1px solid var(--border); border-radius:9px; color:var(--text-secondary); }
        .platform-tabs button[aria-pressed=true] { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
        .release-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:18px; }
        .release { padding:24px; border:1px solid var(--border); border-radius:14px; background:var(--bg-sidebar); min-width:0; }
        .release h2 { font-size:19px; margin:0 0 12px; }
        .release p { color:var(--text-secondary); font-size:13px; margin:10px 0 18px; }
        .release a { display:inline-block; text-decoration:none; }
        .release details { margin-top:20px; color:var(--text-secondary); font-size:12px; }
        .release summary { cursor:pointer; padding:5px 0; }
        .release code { display:block; overflow-wrap:anywhere; font-size:12px; margin-top:10px; }
        .release .qualification { display:inline-block; border:1px solid var(--border-strong); border-radius:6px; padding:3px 8px; margin-bottom:16px; font-size:12px; }
        #downloadStatus { padding:12px 0 20px; font-size:13px; color:var(--text-secondary); }
        .download-help { margin-top:36px; border-top:1px solid var(--border); padding-top:26px; }
        .download-help h2 { font-size:17px; margin-bottom:10px; }
        .download-help ol { margin-left:22px; color:var(--text-secondary); font-size:13px; }
        .download-help li { padding:4px 0; }
        [hidden] { display:none !important; }
        :is(button,a,summary):focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
        @media(max-width:600px) { .downloads { padding:22px 16px; } header { margin-bottom:32px; } h1 { font-size:27px; } .release { padding:20px; } }
    </style>
</head>
<body>
<main class="downloads">
    <header><a class="logo" href="/"><img class="logo-svg" src="/static/logo.svg" alt=""><strong>YwMatrix</strong></a><a href="/">返回工作台</a></header>
    <h1>为你的设备选择客户端</h1>
    <p class="intro">下载后按引导连接组织。Windows 7 使用专用兼容版，麒麟使用 ARM64 解压版，Linux x64 保留 Web 管理。</p>
    <div class="platform-tabs" role="group" aria-label="筛选操作系统">
        <button data-platform="all" aria-pressed="true">全部平台</button><button data-platform="windows" aria-pressed="false">Windows</button><button data-platform="arm" aria-pressed="false">麒麟 ARM64</button><button data-platform="linux" aria-pressed="false">Linux x64</button>
    </div>
    <div id="downloadStatus" role="status">正在读取安装包…</div>
    <button class="btn btn-ghost" id="retryDownloads" hidden>重新加载</button>
    <div id="releases" class="release-grid"></div>
    <section class="download-help"><h2>下载之后怎么用？</h2><ol><li>Windows 运行 Setup；麒麟解压后运行 start.sh；Linux x64 启动后打开本机 Web 页面。</li><li>填写管理员提供的组织地址与配对码，保留地址中的端口。</li><li>等待管理员批准，再从智能体中心安装并启用智能体。</li></ol></section>
</main>
<script>
(() => {
    const status = document.getElementById('downloadStatus'), container = document.getElementById('releases'), retry = document.getElementById('retryDownloads');
    let releases = [], filter = 'all', loadState = 'loading';
    function render() {
        const visible = releases.filter(item => filter === 'all' || (filter === 'windows' ? item.target.startsWith('win') : filter === 'arm' ? item.target === 'linux-arm64' : item.target === 'linux-x64-web'));
        if (loadState === 'ready') status.textContent = visible.length ? '共 ' + visible.length + ' 个安装包 · 请核对系统版本与架构' : releases.length ? '当前筛选下暂无安装包，请选择其他平台。' : '安装包尚未发布，请联系管理员。';
        container.replaceChildren();
        for (const release of visible) {
            const card = document.createElement('section'); card.className = 'release';
            const title = document.createElement('h2'); title.textContent = release.label;
            const info = document.createElement('p'); info.textContent = '版本 ' + release.version + ' · ' + (release.size / 1048576).toFixed(1) + ' MB';
            const note = document.createElement('div');
            if (!release.tested) { note.className = 'qualification'; note.textContent = '目标系统待验收'; }
            const action = document.createElement('a'); action.className = 'btn btn-primary'; action.href = '/clients/files/' + encodeURIComponent(release.file);
            action.textContent = release.file.endsWith('.exe') ? '下载 Setup 安装包' : '下载解压包';
            const details = document.createElement('details'), summary = document.createElement('summary'), digest = document.createElement('code');
            summary.textContent = '文件名与 SHA-256 校验'; digest.textContent = release.file + '\n' + release.sha256;
            details.append(summary,digest); card.append(title,info,note,document.createElement('br'),action,details); container.append(card);
        }
    }
    async function load() {
        loadState = 'loading'; retry.hidden = true; status.textContent = '正在读取安装包…';
        try { const response = await fetch('/clients/catalog', { signal:AbortSignal.timeout(12000) }); if (!response.ok) throw Error('HTTP ' + response.status); releases = (await response.json()).releases || []; loadState = 'ready'; render(); }
        catch { loadState = 'error'; status.textContent = '安装包列表暂时无法加载，请检查网络后重试。'; retry.hidden = false; }
    }
    document.querySelectorAll('[data-platform]').forEach(button => button.onclick = () => { filter = button.dataset.platform; document.querySelectorAll('[data-platform]').forEach(item => item.setAttribute('aria-pressed', String(item === button))); render(); });
    retry.onclick = load; load();
})();
</script>
</body>
</html>
