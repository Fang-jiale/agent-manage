# YwMatrix 网关 Nginx 反代示例：TLS 终结 + WebSocket + 多实例负载均衡
# 放在 /etc/nginx/conf.d/ywmatrix.conf 或 sites-available 后 reload

# 多实例网关（网关本身无状态，Redis 总线负责跨实例路由，任意实例均可承接）
upstream ywmatrix_gateway {
    server 127.0.0.1:8080;
    # server 127.0.0.1:8081;  # 多实例时取消注释
    keepalive 32;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name ywmatrix.internal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ywmatrix.internal.example.com;

    ssl_certificate     /etc/nginx/ssl/ywmatrix.crt;
    ssl_certificate_key /etc/nginx/ssl/ywmatrix.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 附件上传走 JSON+base64（约 1.37 倍体积），20MB 文件 ≈ 28MB 请求体
    client_max_body_size 32m;

    location / {
        proxy_pass http://ywmatrix_gateway;
        proxy_http_version 1.1;

        # WebSocket 升级必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：网关每 30s 有一次 ping，但任务流式输出可能长时间静默于对端方向
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    # 本地盘附件回源：内容按 UUID 命名且 immutable，可激进缓存
    location /files/ {
        proxy_pass http://ywmatrix_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
    }
}

# WebSocket Upgrade 头的映射（置于此文件顶部 http 块生效；若 nginx 提示重复定义，
# 说明 nginx.conf 已有同名 map，删除此处即可）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
